        // --- Helpers ---
        function formatDate(isoString) {
            if (!isoString) return '';
            return new Date(isoString).toLocaleString('ja-JP', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function parseMarkdown(text) {
            if (!text) return '';
            if (window.marked) {
                let html = window.marked.parse(text);
                html = html.replace(/&gt;&gt;(\d+)/g, '<a href="#res$1" class="anchor-link" onclick="scrollToRes($1); return false;">>>$1</a>');
                return html;
            }
            return text.replace(/\n/g, '<br>');
        }

        function scrollToRes(num) {
            const el = document.getElementById(`res${num}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
                el.classList.add('highlight');
                setTimeout(() => el.classList.remove('highlight'), 2000);
            } else {
                alert('そのレスはこのページに存在しません。');
            }
        }

        function getProfile() {
            return JSON.parse(localStorage.getItem('ghub_bbs_profile') || '{}');
        }

        function labelName(label) {
            return typeof label === 'string' ? label : label.name;
        }

        function mergeBoards(baseBoards, extraBoards) {
            const byName = new Map();
            [...baseBoards, ...extraBoards].forEach(board => {
                const current = byName.get(board.name);
                byName.set(board.name, {
                    ...board,
                    desc: board.desc || (current && current.desc) || ''
                });
            });
            return Array.from(byName.values());
        }

        function mergeThreads(primaryThreads, fallbackThreads) {
            const getTime = thread => {
                const time = Date.parse(thread.updated_at || thread.created_at || 0);
                return Number.isNaN(time) ? 0 : time;
            };
            const seen = new Set();
            return [...primaryThreads, ...fallbackThreads]
                .filter(thread => {
                    if (seen.has(thread.number)) return false;
                    seen.add(thread.number);
                    return true;
                })
                .sort((a, b) => getTime(b) - getTime(a));
        }

        function threadsForBoard(threads, boardName) {
            if (!boardName) return threads;
            return threads.filter(t => (t.labels || []).some(l => {
                const name = labelName(l);
                return name === `board:${boardName}` || name === boardName;
            }));
        }

        function isLocalThread(thread) {
            return LOCAL_THREADS.some(t => String(t.number) === String(thread.number));
        }

        function getThreadExternalUrl(thread) {
            if (!isLocalThread(thread)) {
                return `https://github.com/${CONFIG.OWNER}/${CONFIG.REPO}/issues/${thread.number}`;
            }

            const board = ((thread.labels || []).map(labelName).find(l => l.startsWith('board:')) || '').replace('board:', '');
            const urls = {
                '告知': 'https://xenoah.github.io/',
                '更新履歴': 'https://xenoah.github.io/changelog.htm',
                '便利ツール': 'https://xenoah.github.io/sitemap.htm',
                'ミニゲーム': 'https://xenoah.github.io/sitemap.htm',
                'VRChat': 'https://xenoah.github.io/vrchat.htm',
                '3Dモデル': 'https://xenoah.github.io/archive-3dmodels/',
                'すたでぃー': 'https://xenoah.github.io/sitemap.htm',
                'データベース': 'https://xenoah.github.io/sitemap.htm',
                '開発メモ': 'https://xenoah.github.io/portfolio.htm'
            };
            return urls[board] || 'https://xenoah.github.io/';
        }

        function plainExcerpt(markdown, length = 120) {
            return (markdown || '')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/[#*_>`-]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, length);
        }

        // --- API Service ---
        const api = {
            // Static file fetch
            async fetchJson(path) {
                try {
                    const res = await fetch(`data/${path}.json?t=${Date.now()}`); 
                    if (!res.ok) throw new Error(res.statusText);
                    return await res.json();
                } catch (e) {
                    return null;
                }
            },

            // GitHub API fetch (Real-time fallback)
            async fetchGitHubIssues(params = '') {
                try {
                    const res = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/issues?state=open&per_page=100${params}`);
                    if (!res.ok) throw new Error('GitHub API Error');
                    const issues = await res.json();
                    
                    // Normalize to app format
                    return issues.map(issue => ({
                        number: issue.number,
                        title: issue.title,
                        user: { login: issue.user.login },
                        // Labels can be strings or objects depending on API vs JSON
                        labels: issue.labels.map(l => typeof l === 'string' ? l : l.name),
                        state: issue.state,
                        comments: issue.comments,
                        created_at: issue.created_at,
                        updated_at: issue.updated_at,
                        body: issue.body || ''
                    }));
                } catch (e) {
                    console.error(e);
                    return [];
                }
            },

            async fetchGitHubComments(number) {
                try {
                    const res = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/issues/${number}/comments`);
                    if (!res.ok) return [];
                    const comments = await res.json();
                    return comments.map(c => ({
                        user: { login: c.user.login },
                        created_at: c.created_at,
                        body: c.body || ''
                    }));
                } catch(e) {
                    return [];
                }
            },

            async getBoards() {
                // 1. GitHub APIからラベルを取得して動的に板リストを生成
                try {
                    const res = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/labels?per_page=100`);
                    if (res.ok) {
                        const labels = await res.json();
                        // "board:" で始まるラベルを抽出
                        const boardLabels = labels
                            .filter(l => l.name.startsWith('board:'))
                            .map(l => ({
                                id: l.name.replace('board:', ''),
                                name: l.name.replace('board:', ''),
                                desc: l.description || ''
                            }));
                        
                        if (boardLabels.length > 0) {
                            // 名前順にソート (任意)
                            boardLabels.sort((a, b) => a.name.localeCompare(b.name));
                            return mergeBoards(MOCK_BOARDS, boardLabels);
                        }
                    }
                } catch (e) {
                    console.warn("GitHub Labels fetch failed, falling back to static/mock.", e);
                }

                // 2. 失敗時は静的JSONまたはモック
                const data = await this.fetchJson('boards');
                return data ? mergeBoards(MOCK_BOARDS, data) : MOCK_BOARDS;
            },

            async getThreads(boardName) {
                // Try JSON first
                const type = boardName ? `board-${boardName}` : 'index';
                const data = await this.fetchJson(`threads/${type}`);
                if (data) return mergeThreads(data.threads, threadsForBoard(LOCAL_THREADS, boardName));

                // Fallback to GitHub API (Real-time)
                console.log('Fetching from GitHub API...');
                let allIssues = await this.fetchGitHubIssues();
                allIssues = mergeThreads(allIssues, LOCAL_THREADS);
                
                // Filter by board
                return threadsForBoard(allIssues, boardName);
            },

            async getThreadDetail(number) {
                // Try JSON first
                let thread = await this.fetchJson(`thread/${number}`);
                let comments = await this.fetchJson(`comments/${number}`);

                if (!thread) {
                    const localThread = LOCAL_THREADS.find(t => String(t.number) === String(number));
                    if (localThread) {
                        thread = { ...localThread };
                        comments = LOCAL_COMMENTS[localThread.number] || [];
                    }
                }

                if (!thread) {
                    // Fallback to GitHub API
                    // We can reuse fetchGitHubIssues or fetch single issue. Fetching single is better.
                    try {
                        const res = await fetch(`https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/issues/${number}`);
                        if (res.ok) {
                            const issue = await res.json();
                            thread = {
                                number: issue.number,
                                title: issue.title,
                                user: { login: issue.user.login },
                                labels: issue.labels.map(l => l.name),
                                created_at: issue.created_at,
                                updated_at: issue.updated_at,
                                body: issue.body || ''
                            };
                            comments = await this.fetchGitHubComments(number);
                        }
                    } catch(e) { console.error(e); }
                }

                if (thread) {
                    thread.commentList = comments || [];
                    return thread;
                }
                return null;
            },

            async search(query) {
                 const index = await this.fetchJson('search_index');
                 const searchIndex = index ? mergeThreads(index, LOCAL_THREADS) : LOCAL_THREADS;
                 const terms = query.toLowerCase().split(/\s+/);
                 return searchIndex.filter(item => {
                    const text = (item.title + ' ' + (item.body || '')).toLowerCase();
                    return terms.every(term => text.includes(term));
                 });
            }
        };

        function createThreadItem(t) {
            const card = document.createElement('div');
            card.className = 'card thread-item';
            
            // Determine board label safely
            let boardLabel = '';
            const boardLabelRaw = t.labels.find(l => {
                const name = labelName(l);
                return name.startsWith('board:');
            });
            if (boardLabelRaw) {
                const name = labelName(boardLabelRaw);
                boardLabel = name.replace('board:', '');
            }

            const isPinned = t.labels.some(l => labelName(l) === 'pinned');
            const excerpt = plainExcerpt(t.body);
            
            card.innerHTML = `
                <h3>
                    ${isPinned ? '<span class="badge pinned">固定</span>' : ''}
                    <a href="#" class="thread-link">${t.title}</a>
                </h3>
                ${excerpt ? `<p class="thread-summary">${excerpt}${excerpt.length >= 120 ? '...' : ''}</p>` : ''}
                <div class="thread-meta">
                    ${boardLabel ? `<span class="badge">${boardLabel}</span>` : ''}
                    <span>レス: ${t.comments}</span> / 
                    <span> 作成: ${t.user.login}</span> / 
                    <span> 更新: ${formatDate(t.updated_at)}</span>
                </div>
            `;
            
            card.querySelector('.thread-link').onclick = (e) => {
                e.preventDefault();
                state.currentThreadId = t.number;
                state.view = 'thread';
                renderApp(); 
            };
            return card;
        }

        function renderThreadDetail(container, t) {
            container.innerHTML = '';
            
            // Header
            const header = document.createElement('div');
            header.className = 'page-header';
            
            const backLink = document.createElement('a');
            backLink.href = '#';
            backLink.textContent = '← 戻る';
            backLink.style.marginRight = '1rem';
            backLink.onclick = (e) => { e.preventDefault(); state.view = 'index'; renderMain(); };

            const h2 = document.createElement('h2');
            h2.style.flexGrow = '1';
            h2.textContent = t.title;

            const ghLink = document.createElement('a');
            ghLink.href = getThreadExternalUrl(t);
            ghLink.target = '_blank';
            ghLink.rel = 'noopener';
            ghLink.className = 'btn';
            ghLink.textContent = isLocalThread(t) ? '関連ページへ' : 'GitHubで見る';

            header.appendChild(backLink);
            header.appendChild(h2);
            header.appendChild(ghLink);
            container.appendChild(header);

            // Posts
            const postsContainer = document.createElement('div');
            postsContainer.className = 'posts-container';

            // Res 1
            postsContainer.innerHTML += createPostHtml(1, t.user.login, t.created_at, t.body, true);

            // Comments
            if (t.commentList) {
                t.commentList.forEach((c, idx) => {
                    postsContainer.innerHTML += createPostHtml(idx + 2, c.user.login, c.created_at, c.body);
                });
            }

            container.appendChild(postsContainer);

            // Reply Section
            const profile = getProfile();
            const boardLabel = ((t.labels || []).map(labelName).find(l => l.startsWith('board:')) || 'board:雑談').replace('board:', '');
            const replyHref = isLocalThread(t)
                ? `https://github.com/${CONFIG.OWNER}/${CONFIG.REPO}/issues/new?labels=${encodeURIComponent(`board:${boardLabel}`)}&title=${encodeURIComponent(t.title)}`
                : `https://github.com/${CONFIG.OWNER}/${CONFIG.REPO}/issues/${t.number}#new_comment_field`;
            const replyDiv = document.createElement('div');
            replyDiv.className = 'card reply-section';
            replyDiv.innerHTML = `
                <h3>レスを投稿する</h3>
                <p class="notice">
                    投稿にはGitHubアカウントが必要です。下のボタンを押すとGitHubのIssueページへ移動します。<br/>
                    現在の設定名: <strong>${profile.handle || '設定なし'}</strong> (署名に使われます)
                </p>
                <a href="${replyHref}" target="_blank" rel="noopener" class="btn primary large">
                    ${isLocalThread(t) ? 'GitHubでこの話題を書く' : 'GitHubで返信する'}
                </a>
            `;
            container.appendChild(replyDiv);
        }

        function createPostHtml(num, user, date, body, isAdmin = false) {
            const adminBadge = (user === 'admin' || isAdmin && user === 'admin') ? '<span class="badge pinned" style="margin-left:0.5rem">Admin</span>' : '';
            return `
                <div class="post" id="res${num}">
                    <div class="post-header">
                        <div>
                            <span class="res-number">${num}</span>
                            <span style="font-weight: bold">${user}</span>
                            ${adminBadge}
                        </div>
                        <div>${formatDate(date)}</div>
                    </div>
                    <div class="post-body">
                        ${parseMarkdown(body)}
                    </div>
                </div>
            `;
        }

        function renderSettings(container) {
            container.innerHTML = '';
            const profile = getProfile();

            const card = document.createElement('div');
            card.className = 'card';
            card.style.maxWidth = '600px';
            card.style.margin = '0 auto';
            card.innerHTML = `
                <h2>ユーザー設定</h2>
                <p class="notice">この設定はブラウザ(LocalStorage)に保存されます。</p>
                
                <div class="form-group">
                    <label>表示名 (Handle)</label>
                    <input class="form-control" id="input-handle" value="${profile.handle || ''}" placeholder="名無しさん">
                </div>
                
                <div class="form-group">
                    <label>自己紹介 / 署名</label>
                    <textarea class="form-control" rows="3" id="input-bio" placeholder="よろしくお願いします">${profile.bio || ''}</textarea>
                </div>
                
                <div class="form-group">
                    <label>テーマ</label>
                    <select class="form-control" id="input-theme">
                        <option value="auto" ${profile.theme === 'auto' ? 'selected' : ''}>システムに従う (Auto)</option>
                        <option value="light" ${profile.theme === 'light' ? 'selected' : ''}>ライト (Light)</option>
                        <option value="dark" ${profile.theme === 'dark' ? 'selected' : ''}>ダーク (Dark)</option>
                    </select>
                </div>

                <button class="btn primary" id="btn-save">設定を保存</button>
                <span id="msg-save" style="margin-left: 1rem; color: var(--accent-color);"></span>
            `;

            container.appendChild(card);

            document.getElementById('btn-save').onclick = () => {
                const handle = document.getElementById('input-handle').value;
                const bio = document.getElementById('input-bio').value;
                const theme = document.getElementById('input-theme').value;

                localStorage.setItem('ghub_bbs_profile', JSON.stringify({ handle, bio, theme }));
                applyTheme();
                
                const msg = document.getElementById('msg-save');
                msg.textContent = '保存しました！';
                setTimeout(() => msg.textContent = '', 2000);
            };
        }

        function renderSearch(container) {
            container.innerHTML = `
                <div class="search-box">
                    <h2>スレッド検索</h2>
                    <form id="search-form" style="display: flex; gap: 0.5rem;">
                        <input class="form-control" id="search-input" placeholder="キーワードを入力...">
                        <button type="submit" class="btn primary">検索</button>
                    </form>
                </div>
                <div id="search-results"></div>
            `;

            document.getElementById('search-form').onsubmit = async (e) => {
                e.preventDefault();
                const query = document.getElementById('search-input').value;
                if (!query.trim()) return;

                const resultsDiv = document.getElementById('search-results');
                resultsDiv.innerHTML = '<div class="loading">検索中...</div>';

                const results = await api.search(query);
                resultsDiv.innerHTML = '';
                
                if (results.length === 0) {
                    resultsDiv.innerHTML = '<p>見つかりませんでした。</p>';
                } else {
                    results.forEach(t => resultsDiv.appendChild(createThreadItem(t)));
                }
            };
        }

        function applyTheme() {
            const p = getProfile();
            const theme = p.theme || 'auto';
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            else if (theme === 'light') document.documentElement.removeAttribute('data-theme');
            else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();

            // Nav Listeners
            document.getElementById('logo-link').onclick = (e) => { e.preventDefault(); state.currentBoard = null; state.view = 'index'; renderMain(); renderSidebar(); };
            document.getElementById('nav-new').onclick = (e) => { e.preventDefault(); state.currentBoard = null; state.view = 'index'; renderMain(); renderSidebar(); };
            document.getElementById('nav-search').onclick = (e) => { e.preventDefault(); state.view = 'search'; renderMain(); renderHeader(); };
            document.getElementById('nav-settings').onclick = (e) => { e.preventDefault(); state.view = 'settings'; renderMain(); renderHeader(); };

            // Initial Render
            renderApp();
        });

    </script>
</body>
</html>
